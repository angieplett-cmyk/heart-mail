<script>/* Heart Mail: classroom check-in kiosk. Everything stays on this iPad. Messages are locked (encrypted) with the teacher passcode. */
"use strict";
const APP_VERSION="1.0",BUILD="65c2b034",KEY="heartMail.v1",UPD_KEY="heartMail.wantUpdate";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const DEFAULT_NOTE=`Mrs. Plett reads every Heart Mail.
Most things you tell me stay between us.
But my most important job is to keep kids safe.

If you tell me that someone is hurting you, that you are not safe at home, or that you might hurt yourself or someone else, I have to tell another grown-up whose job is to help keep kids safe.

You will NOT be in trouble for telling.
When I can, I will talk with you first.

Heart Mail is only read on school days. It is not an emergency button.
If you need help RIGHT NOW, go tell a grown-up in person or call 911.`;
const DEFAULT_WORDS="hurt, hit, punch, kick, choke, touch, kill, die, dead, gun, knife, knives, weapon, scared, afraid, unsafe, not safe, home, suicide, cut, abuse, bruise, blood, bleed, threaten";
const DEFAULT_CHECK="I check Heart Mail after morning recess, after lunch recess, and before dismissal.";
const DEFAULTS={teacher:"Mrs. Plett",counselor:"",anon:true,askWho:true,idle:60,note:DEFAULT_NOTE,noteOK:false,words:DEFAULT_WORDS,check:DEFAULT_CHECK,
  btn:{hungry:true,talk:true,upset:true,sick:true,good:true},alert:{on:false,mode:"formsubmit",email:"aplett@greeleyschools.org",url:""}};
function blank(){return {v:1,sec:null,set:JSON.parse(JSON.stringify(DEFAULTS)),roster:[],msgs:[]}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(!d||typeof d!=="object")d=blank();
  d.set=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),d.set||{});d.set.btn=Object.assign({},DEFAULTS.btn,d.set.btn||{});d.set.alert=Object.assign({},DEFAULTS.alert,d.set.alert||{});
  d.roster=Array.isArray(d.roster)?d.roster.filter(x=>typeof x==="string"):[];d.msgs=Array.isArray(d.msgs)?d.msgs:[];return d}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){toast("⚠️ Could not save. The iPad may be full.");return false}}
const T=()=>DB.set.teacher||"Mrs. Plett";
function toast(t){const d=$("#toast");d.textContent=t;d.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>d.classList.remove("on"),2600)}
/* ---- crypto: RSA-OAEP key pair; private key locked with AES-GCM from PBKDF2(passcode) ---- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const HAS_CRYPTO=!!(window.crypto&&crypto.subtle&&window.isSecureContext!==false);
const ITER=250000;
async function passKey(pin,salt,it){const base=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function lockPriv(priv,pin){const pk8=await crypto.subtle.exportKey("pkcs8",priv),salt=rnd(16),iv=rnd(12);
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await passKey(pin,salt,ITER),pk8);return {s:b64(salt),iv:b64(iv),c:b64(c),it:ITER}}
async function createKeys(pin){const kp=await crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);
  DB.sec={pub:await crypto.subtle.exportKey("jwk",kp.publicKey),priv:await lockPriv(kp.privateKey,pin)};return kp.privateKey}
async function unlockPriv(pin){const p=DB.sec&&DB.sec.priv;if(!p)return null;
  try{const pk8=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(p.iv)},await passKey(pin,ub64(p.s),p.it||ITER),ub64(p.c));
    return await crypto.subtle.importKey("pkcs8",pk8,{name:"RSA-OAEP",hash:"SHA-256"},true,["decrypt"])}catch(e){return null}}
let PUB=null;
async function pubKey(){if(!PUB)PUB=await crypto.subtle.importKey("jwk",DB.sec.pub,{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);return PUB}
async function seal(obj){const k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]),iv=rnd(12);
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(JSON.stringify(obj)));
  const wk=await crypto.subtle.encrypt({name:"RSA-OAEP"},await pubKey(),await crypto.subtle.exportKey("raw",k));
  return {k:b64(wk),iv:b64(iv),c:b64(c)}}
async function unseal(box,priv){const raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},priv,ub64(box.k));
  const k=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(box.iv)},k,ub64(box.c))))}

  good:{em:"⭐",label:"Something good!",tlabel:"Something good",c:"#FFF3BF"}};
const Q={

  what:{t:"What happened",q:"What happened?",hint:"You can pick more than one.",multi:true,o:[["mean","😠","Mean words or names"],["left","🚫","Left out"],["hit","✋","Hit, pushed, or kicked"],["stuff","🎒","Took or broke my stuff"],["online","📱","Online or on a phone"],["keeps","🔁","It keeps happening"],["other","❓","Something else"]]},
  where:{t:"Where",q:"Where did it happen?",o:[["recess","🌳","Recess / playground"],["class","🏫","Our classroom"],["hall","🚪","Hallway"],["lunch","🍽️","Lunchroom"],["bath","🚻","Bathroom"],["bus","🚌","Bus"],["other","❓","Other place"]]},
  when:{t:"When",q:"When did it happen?",o:[["recess","☀️","Today at recess"],["class","📚","Today in class"],["yday","🌙","Yesterday"],["before","📅","Before that"],["lot","🔁","It happens a lot"]]},

function wordRe(){const ws=(DB.set.words||"").split(/[,\n]/).map(w=>w.trim().toLowerCase()).filter(Boolean);if(!ws.length)return null;

function assess(d){const a=d.ans||{};let lv="soon";

    else if(a.soon==="know"&&!["sad","worried","mad"].includes(a.feel))lv="later"}
  else if(d.type==="hungry"||d.type==="sick")lv="now";
  else if(d.type==="talk")lv=a.talkSoon==="today"?"now":"soon";

function cleanName(line){let s=String(line||"").replace(/[ \u00a0]+/g," ").trim();if(!s)return "";
  let first,last;
  if(s.includes("\t")){[first,last]=s.split("\t").map(x=>x.trim())}
  else if(s.includes(",")){const p=s.split(",").map(x=>x.trim());last=p[0];first=p[1]||""}
  else{const p=s.split(" ");first=p[0];last=p.slice(1).join(" ")}
  if(!first){first=last;last=""}
  if(/^[A-Z]\.?$/i.test(last||""))last=last.replace(".","");
  const cap=w=>w?w.charAt(0).toUpperCase()+w.slice(1):"";
  return (cap(first)+(last?" "+cap(last).charAt(0)+".":"")).slice(0,40)}

    files[name]={method,data};p+=46+nl+el+cl;
  }
  return {async text(name){const f=files[name];if(!f)return null;const raw=f.method===0?f.data:await inflateRaw(f.data);return td.decode(raw)},names:Object.keys(files)};
}

  const wb=await z.text("xl/workbook.xml");if(!wb)throw new Error("NOT_XLSX");
  const rels=xmlDoc(await z.text("xl/_rels/workbook.xml.rels")||"<x/>");const relMap={};tags(rels,"Relationship").forEach(r=>relMap[r.getAttribute("Id")]=r.getAttribute("Target"));
  const ssT=await z.text("xl/sharedStrings.xml");const ss=ssT?tags(xmlDoc(ssT),"si").map(si=>tags(si,"t").filter(t=>!(t.parentNode&&t.parentNode.localName==="rPh")).map(t=>t.textContent).join("")):[];
  const out=[];
  for(const sh of tags(xmlDoc(wb),"sheet")){
    const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    let target=relMap[rid]||"";target=target.replace(/^\//,"");if(!target.startsWith("xl/"))target="xl/"+target;
    const x=await z.text(target);if(!x)continue;const rows=[];
    tags(xmlDoc(x),"row").forEach(r=>{const ri=Number(r.getAttribute("r"))-1;const row=[];
      tags(r,"c").forEach((c,ci)=>{const ix=c.getAttribute("r")?colIdx(c.getAttribute("r")):ci;const t=c.getAttribute("t");const v=tags(c,"v")[0];let val=null;
        if(t==="s")val=v?ss[Number(v.textContent)]:null;else if(t==="b")val=v?v.textContent==="1":null;else if(t==="inlineStr")val=tags(c,"t").map(e=>e.textContent).join("");
        else if(t==="str"||t==="e")val=v?v.textContent:null;else val=v?(isNaN(Number(v.textContent))?v.textContent:Number(v.textContent)):null;
        row[ix]=val});

function parseCSV(text){
  const rows=[];let row=[],f="",q=false;text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","||c==="\t"){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}

function steps(type){const f=FLOW[type].filter(k=>k!=="who"||DB.set.askWho);return ["note","name",...f]}
function startFlow(type){S={type,steps:steps(type),i:0,ans:{},name:null};VIEW="flow";render()}
function wipe(){S=null;SENT=null;clearTimeout(SENT_T);IDLEWARN=false;const iw=$(".idle");if(iw)iw.remove();
  document.querySelectorAll("textarea.kidtext").forEach(t=>t.value="");VIEW="home"}
function goHome(){wipe();render()}
function flowHTML(){const k=S.steps[S.i],n=S.steps.length;
  const dots=`<div class="dots" aria-hidden="true">${S.steps.map((_,j)=>`<i class="${j<S.i?"done":j===S.i?"on":""}"></i>`).join("")}</div>`;
  const head=kidTop(`<button class="navbtn" type="button" data-a="back">⬅ Back</button>${dots}<button class="navbtn" type="button" data-a="stop">✖ Stop</button>`);
  let body="";
  if(k==="note"){const paras=String(DB.set.note||DEFAULT_NOTE).trim().split(/\n\s*\n/);
    body=`<div class="note"><h2>💜 Telling is brave</h2>${paras.map(p=>`<p>${p.split("\n").map(esc).join("<br>")}</p>`).join("")}</div>
    <div class="actions"><button class="go" type="button" data-a="next">I understand 💜</button></div>`}
  else if(k==="name"){const r=DB.roster;
    body=`<h1 class="q">Who are you?</h1><p class="hint">${r.length?"Tap your name.":`${esc(T())} has not added the class list yet.`}</p>
    <div class="opts names">${r.map(nm=>`<button class="opt" type="button" data-a="name" data-v="${esc(nm)}">${esc(nm)}</button>`).join("")}
    ${DB.set.anon||!r.length?`<button class="opt wide ghost" type="button" data-a="name" data-v="${ANON}"><span class="em">🙈</span>${r.length?"I'd rather not say":"Keep going"}</button>`:""}</div>`}
  else{const q=Q[k];
    body=`${q.pre?`<p class="pre">${esc(q.pre)}</p>`:""}<h1 class="q">${esc(q.q)}</h1>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:""}`;
    if(q.text){const v=S.ans[k]||"";
      body+=`<textarea class="kidtext" id="kt" data-k="${k}" maxlength="1000" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="sentences" enterkeyhint="done" aria-label="${esc(q.q)}" placeholder="Type here…">${esc(v)}</textarea>
      <div class="count"><span id="ktc">${v.length}</span> / 1000</div><div class="actions"><button class="go" type="button" data-a="send">Send 💌</button></div>`}
    else if(q.names){const sel=S.ans.who||[];const list=DB.roster.filter(x=>x!==S.name).concat([NOT_CLASS,NO_NAME]);
      body+=`<div class="opts names">${list.map(nm=>`<button class="opt${sel.includes(nm)?" sel":""}${nm===NOT_CLASS||nm===NO_NAME?" ghost":""}" type="button" data-a="multi" data-k="who" data-v="${esc(nm)}">${nm===NOT_CLASS?"🏫 ":nm===NO_NAME?"🤷 ":""}${esc(nm)}</button>`).join("")}</div>
      <div class="actions">${sel.length?`<button class="go" type="button" data-a="next">Next ➡</button>`:`<button class="go soft" type="button" data-a="next">Skip ➡</button>`}</div>`}
    else{const cur=S.ans[k];
      body+=`<div class="opts">${q.o.map(([v,em,l],j)=>{const on=q.multi?(cur||[]).includes(v):cur===v;
        return `<button class="opt${on?" sel":""}" type="button" data-a="${q.multi?"multi":"pick"}" data-k="${k}" data-v="${v}" style="--c:${PAL[j%PAL.length]}" aria-pressed="${on}"><span class="em">${em}</span>${esc(l)}</button>`}).join("")}</div>
      ${q.multi?`<div class="actions"><button class="go" type="button" data-a="next" ${(cur||[]).length?"":"disabled"}>Next ➡</button></div>`:""}`}}
  return `<div class="kid">${head}${body}</div>${banner()}`}

  if(t==="hungry")x=`Thanks for telling me. ${T()} will help. 🍎`;

function advance(){S.i++;if(S.i>=S.steps.length)return send();render();window.scrollTo(0,0)}
let SENDING=false;
async function send(){if(SENDING||!S)return;SENDING=true;
  const ta=$("#kt");if(ta)S.ans[ta.dataset.k]=ta.value.trim();
  const d={type:S.type,name:S.name||ANON,ans:S.ans,t:Date.now(),v:APP_VERSION};
  try{const box=await seal(d);DB.msgs.push({id:uid(),t:d.t,st:"new",box});if(!save()){DB.msgs.pop();SENDING=false;return}try{queueAlert(assess(d).pin)}catch(e){}}
  catch(e){SENDING=false;toast("⚠️ Heart Mail could not save that. Please tell "+T()+" in person.");return}
  SENDING=false;const info={type:S.type};wipe();SENT=info;VIEW="sent";render();
  clearTimeout(SENT_T);SENT_T=setTimeout(()=>{if(VIEW==="sent"&&MODE==="kid")goHome()},9000)}
function kidClick(a,el){
  if(a==="start")return startFlow(el.dataset.k);
  if(a==="help"){VIEW="help";return render()}
  if(a==="home"||a==="stop")return goHome();
  if(a==="teacher"){wipe();MODE="pin";PIN={mode:"unlock",v:""};return render()}
  if(!S)return;
  if(a==="back"){const ta=$("#kt");if(ta)S.ans[ta.dataset.k]=ta.value;if(S.i===0)return goHome();S.i--;return render()}
  if(a==="next")return advance();
  if(a==="name"){S.name=el.dataset.v;if(S.ans.who)S.ans.who=S.ans.who.filter(x=>x!==S.name);el.classList.add("sel");return setTimeout(advance,140)}
  if(a==="pick"){S.ans[el.dataset.k]=el.dataset.v;el.classList.add("sel");return setTimeout(advance,140)}
  if(a==="multi"){const k=el.dataset.k,v=el.dataset.v,arr=S.ans[k]||(S.ans[k]=[]);const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);return render()}
  if(a==="send")return send()}

async function pinOK(){const m=PIN.mode,v=PIN.v;PIN_MSG="";
  if(v.length<4){PIN_MSG="Use at least 4 numbers.";return render()}
  if(m==="new1"||m==="chg1"){PIN={mode:m==="new1"?"new2":"chg2",v:"",first:v};return render()}
  if(m==="new2"||m==="chg2"){if(v!==PIN.first){PIN_MSG="Those didn't match. Let's start again.";PIN={mode:m==="new2"?"new1":"chg1",v:""};return render()}
    BUSY=true;render();try{if(m==="new2"){PRIV=await createKeys(v);PUB=null;save();MODE="teacher";TV="settings";BUSY=false;render();toast("Passcode saved. Add your class list next.")}
      else{DB.sec.priv=await lockPriv(PRIV,v);save();MODE="teacher";TV="settings";BUSY=false;render();toast("Passcode changed.")}}
    catch(e){BUSY=false;PIN={mode:m==="new2"?"new1":"chg1",v:""};PIN_MSG="Something went wrong. Please try again.";render()}return}
  if(WAIT_UNTIL>Date.now())return render();
  BUSY=true;render();const k=await unlockPriv(v);BUSY=false;
  if(!k){FAILS++;PIN.v="";PIN_MSG="That passcode didn't work.";if(FAILS>=5){WAIT_UNTIL=Date.now()+30000*Math.pow(2,Math.min(4,FAILS-5));setTimeout(render,1000);const tk=setInterval(()=>{if(MODE!=="pin"||WAIT_UNTIL<=Date.now()){clearInterval(tk);PIN_MSG="";}render()},1000)}return render()}
  FAILS=0;PRIV=k;MODE="teacher";TV="inbox";PIN={mode:"unlock",v:""};await loadItems();render()}
async function loadItems(){const out=[];for(const m of DB.msgs){try{const d=await unseal(m.box,PRIV);let note="";if(m.note){try{note=(await unseal(m.note,PRIV)).n||""}catch(e){}}
  out.push({m,d,note,a:assess(d)})}catch(e){out.push({m,d:null,note:"",a:{lv:"soon",words:[],pin:false}})}}ITEMS=out}

function ansRows(d){const a=d.ans||{},r=[];const L=(k,v)=>r.push([Q[k].t,v]);
  if(a.about)L("about",lab("about",a.about));if(a.what&&a.what.length)L("what",a.what.map(v=>lab("what",v)).join(", "));
  if(a.where)L("where",lab("where",a.where));if(a.when)L("when",lab("when",a.when));
  if(d.type==="report"&&DB.set.askWho||a.who)L("who",a.who&&a.who.length?a.who.join(", "):"(skipped)");
  ["grownup","feel","soon","talkSoon","sickWhat"].forEach(k=>{if(a[k])L(k,lab(k,a[k]))});return r}
function hl(text,words){let h=esc(text);if(!words.length)return h;const re=wordRe();return re?h.replace(re,m=>`<mark>${m}</mark>`):h}
function msgHTML(it){const {m,d,a}=it;if(!d)return `<div class="msg"><b>⚠️ This message could not be opened.</b><div class="mfoot"><button class="b sm dan" type="button" data-a="del" data-id="${m.id}">Delete</button></div></div>`;

let FLUSHING=false,ALERT_RETRY=0;
async function flushAlerts(){const c=alertCfg(),q=DB.aq;if(FLUSHING||!c||!c.on||!q||!q.n)return;
  if(navigator.onLine===false){DB.alast={t:Date.now(),ok:false,msg:"Waiting for Wi-Fi"};save();return}
  if(Date.now()<ALERT_RETRY)return;
  FLUSHING=true;const n=q.n,u=q.u,since=q.since;
  try{await postAlert(n,u,false,since);DB.aq={n:Math.max(0,DB.aq.n-n),u:Math.max(0,DB.aq.u-u),since:Date.now()};DB.alast={t:Date.now(),ok:true,msg:"Sent"};ALERT_RETRY=0}
  catch(e){DB.alast={t:Date.now(),ok:false,msg:String(e.message||e)};ALERT_RETRY=Date.now()+60000}
  finally{FLUSHING=false;save()}}

    const v=ta.value.trim();dm.note=v?await seal({n:v}):undefined;it.note=v;save();const s=document.getElementById("ns-"+id);if(s)s.textContent="Saved 🔒";return}
  if(a==="del"){DELID=el.dataset.id;return dlg(`<h2>🗑 Delete this message?</h2><p>It will be gone from this iPad for good.</p><div class="row"><button class="b dan" type="button" data-a="delyes">Delete</button><button class="b" type="button" data-a="dlgclose">Cancel</button></div>`)}
  if(a==="delyes"){DB.msgs=DB.msgs.filter(x=>x.id!==DELID);ITEMS=ITEMS.filter(i=>i.m.id!==DELID);save();const y=window.scrollY;render();window.scrollTo(0,y);return toast("Deleted.")}
  if(a==="deldone"){const n=DB.msgs.filter(x=>x.st==="done").length;return dlg(`<h2>Delete all Done?</h2><p>This deletes ${n} message(s) marked Done.</p><div class="row"><button class="b dan" type="button" data-a="deldoneyes">Delete ${n}</button><button class="b" type="button" data-a="dlgclose">Cancel</button></div>`)}
  if(a==="deldoneyes"){DB.msgs=DB.msgs.filter(x=>x.st!=="done");ITEMS=ITEMS.filter(i=>i.m.st!=="done");save();render();return toast("Deleted.")}
  if(a==="csv"){const r=await shareOrDownload(`Heart-Mail-${stamp()}.csv`,toCSV(exportRows()),"text/csv");if(r!=="cancelled")toast("CSV ready. It is not locked, so keep it private.");return}
  if(a==="print")return printAll();
  if(a==="saveRoster"){const n=setRoster($("#roster").value.split(/\n/));render();return toast(`Saved ${n} names.`)}
  if(a==="pickRoster")return $("#rosterFile").click();
  if(a==="pickRestore")return $("#restoreFile").click();
  if(a==="backup")return doBackup();
  if(a==="doRestore"){if(!validBackup(RESTORE))return;localStorage.setItem(KEY,JSON.stringify(RESTORE.data));DB=load();PUB=null;RESTORE=null;closeDlg();lockTeacher();MODE="pin";PIN={mode:"unlock",v:""};PIN_MSG="Backup restored. Type the passcode from when the backup was made.";render();return}
  if(a==="resetNote"){DB.set.note=DEFAULT_NOTE;DB.set.noteOK=false;save();render();return toast("Note reset to the plan wording.")}
  if(a==="chgpin"){MODE="pin";PIN={mode:"chg1",v:""};PIN_MSG="";return render()}
  if(a==="testAlert")return testAlert();
  if(a==="chkupd")return checkForUpdate(true);
  if(a==="erase")return dlg(`<h2>Erase everything?</h2><p>This deletes all messages, the class list, settings, and the passcode on this iPad. It can't be undone.</p><p>Type <b>ERASE</b> to confirm.</p><input type="text" id="eraseTxt" autocomplete="off" autocorrect="off" spellcheck="false" style="width:100%;font-size:20px;padding:10px;border-radius:12px;border:2px solid #E9DEF7"><div class="row"><button class="b dan" type="button" data-a="eraseyes">Erase</button><button class="b" type="button" data-a="dlgclose">Cancel</button></div>`);
  if(a==="eraseyes"){if(($("#eraseTxt").value||"").trim().toUpperCase()!=="ERASE")return toast("Type ERASE to confirm.");localStorage.removeItem(KEY);DB=load();PRIV=null;PUB=null;ITEMS=[];MODE="pin";PIN={mode:"new1",v:""};render();return}
});
let DELID=null;
document.addEventListener("change",e=>{const t=e.target;if(MODE!=="teacher")return;
  if(t.id==="rosterFile"&&t.files[0]){importRoster(t.files[0]);t.value="";return}
  if(t.id==="restoreFile"&&t.files[0]){restoreFile(t.files[0]);t.value="";return}
  if(t.dataset.set){const k=t.dataset.set;let v=t.type==="checkbox"?t.checked:t.value;
    if(k==="idle"){v=Math.min(300,Math.max(20,Math.round(Number(v)||60)));t.value=v}
    if(k==="teacher"&&!String(v).trim())v="Mrs. Plett";
    setVal(k,v);if(k==="alert.on"&&v)flushAlerts();if((t.type==="checkbox"&&k==="noteOK")||k==="alert.mode"){const y=window.scrollY;render();window.scrollTo(0,y)}toast("Saved ✓")}});
/* hide/sleep: wipe kid drafts right away; lock teacher if away 20+ seconds */
let HID=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden){HID=Date.now();if(MODE==="kid"&&VIEW!=="home"){wipe();render()}}
  else{if(HID&&Date.now()-HID>20000&&(MODE==="teacher"||MODE==="pin")&&DB.sec)lockTeacher();HID=0;LAST=Date.now()}});
window.addEventListener("pagehide",()=>{if(MODE==="kid"&&S){wipe()}});
/* ---- service worker + update flow (same as REMI Bank): reg.waiting at tap time, fallback reload, no loop ---- */
let REG=null,UPDATING=false;
function reloadFresh(){const u=new URL(location.href);u.searchParams.set("v",Date.now().toString(36));location.replace(u.toString())}
function doUpdate(){if(UPDATING)return;UPDATING=true;const b=$("#reloadBtn");if(b){b.textContent="Updating…";b.disabled=true}
  sessionStorage.setItem(UPD_KEY,"1");
  try{const w=REG&&REG.waiting;if(w)w.postMessage({type:"SKIP_WAITING"});else{reloadFresh();return}}catch(e){reloadFresh();return}
  setTimeout(reloadFresh,1500)}
function updateBar(){UPD=true;if(MODE==="teacher"&&!$(".updbar")){const y=window.scrollY;render();window.scrollTo(0,y)}}
async function checkForUpdate(manual){if(!REG){manual&&toast("Updates work once Heart Mail is opened from its web link.");return}
  try{await REG.update()}catch(e){}if(REG.waiting){updateBar()}else if(manual)setTimeout(()=>{REG.waiting?updateBar():toast("You have the newest version.")},1500)}
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!UPDATING)return;reloadFresh()});
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(reg=>{REG=reg;
      const want=sessionStorage.getItem(UPD_KEY)==="1";sessionStorage.removeItem(UPD_KEY);
      if(reg.waiting&&navigator.serviceWorker.controller){if(want){UPDATING=true;reg.waiting.postMessage({type:"SKIP_WAITING"})}else updateBar()}
      reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)updateBar()})});
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update().catch(()=>{})});
    }).catch(()=>{})});
}
if(location.search.includes("v=")){try{const u=new URL(location.href);u.searchParams.delete("v");history.replaceState(null,"",u.pathname+u.search+u.hash)}catch(e){}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
window.addEventListener("storage",e=>{if(e.key===KEY){DB=load();PUB=null}});
render();
</script>
